<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Lab Program 1</title>
    <link rel='stylesheet' type='text/css' href='layout1.css'>
    <link rel='stylesheet' type='text/css' href='css/bootstrap.min.css'>
    <style>
        .menu { margin-top: 11px; }
        .result { margin-top: 20px; padding: 10px; border: 1px solid #000; display: none; }
        iframe { width: 100%; height: 300px; border: none; }
        textarea { width: 100%; height: 300px; font-family: monospace; }
    </style>
</head>
<body>
<div class='bgcontainer'>
    <div class='container'>
        <img src='0.jpg' style='width:990px;height:150px'>
    </div>
    
    <div class='maincontent1'><br />
        <div class="question"> 
            <p>Lab Program 2:<br>Develop and demonstrate a XHTML file that includes Javascript script for the following problems:   <br>
            a) Fibonacci numbers<br>
            b) Table of numbers and their squares</p>
        </div>
        
        <p>Solution:</p>
        <textarea id="codeEditor"></textarea>
    </div>

    <button onclick="showResult()">Show Result</button>
    <div class="result" id="resultDiv">
        <p>Output:</p>
        <div id="outputContainer"></div>
    </div>
    <div class='footer'>
        <span style='margin-left: 14px;'>CopyRight</span>
        <span style='float:right;margin-right: 14px;'>Design by Akshay S(MCA)</span>
    </div>
</div>

<script>
    let htmlCode = `
<html>
<head>
    <title>program-3</title>
    <style type=text/css>
        
    .paragraph1
    {
        width:100px;
        height:100px;
        border:solid thick black;
        padding:10px;
        position:absolute;
        z-Index:0;
        }
    #p1
    {
        background-color:lime;
        text-align:center;
        top:100px;
        left:100px;
        }
     #p2
    {
        background-color:navy;
        text-align:center;
        color:White;
        top:120px;
        left:120px;
        
        }
      #p3
     {
        background-color:Fuchsia;
        text-align:center;
        top:130px;
        left:130px;
        }  
    </style>

</head>
<body>
<p id=p2 class="paragraph1" onmouseover="mover(p2);">This is second page</p>
<p id=p3 class="paragraph1" onmouseover="mover(p3);">This is third page</p>
<p id=p1 class="paragraph1" onmouseover="mover(p1);">This is first page</p>
<script type="text/javascript">
    var TopLayer = document.getElementById("p1");
    function mover(Top) {
        TopLayer.style.zIndex = "0";
        Top.style.zIndex = "1";
        TopLayer = Top;
    }
<\/script>

</body>
</html>`;

    document.getElementById("codeEditor").value = htmlCode;

    function showResult() {
        var code = document.getElementById("codeEditor").value;
        var resultDiv = document.getElementById("resultDiv");
        resultDiv.style.display = "block";

        let outputContainer = document.getElementById("outputContainer");
        outputContainer.innerHTML = "";

        let iframe = document.createElement("iframe");
        outputContainer.appendChild(iframe);

        let doc = iframe.contentWindow.document;
        doc.open();
        doc.write(code);
        doc.close();
    }
</script>
</body>
</html>
